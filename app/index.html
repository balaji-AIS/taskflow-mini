<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskFlow Mini</title><style>body{font:16px system-ui;background:#f3f6fb;margin:0;padding:50px 15px;color:#19253c}.panel{max-width:560px;margin:auto;background:white;padding:30px;border-radius:18px;box-shadow:0 8px 35px #d9e0ed}h1{margin:0}p{color:#617087}.counts{display:flex;gap:18px}.counts h3{margin:10px 0 18px}input[type=text]{padding:13px;border:1px solid #bbc6d6;border-radius:8px;width:65%}button{padding:13px;border:0;background:#265de4;color:white;border-radius:8px;cursor:pointer}li{display:flex;gap:10px;align-items:center;padding:12px;border-bottom:1px solid #e9edf5}li.completed span{text-decoration:line-through;color:#617087}</style><div class="panel"><h1>✅ TaskFlow Mini</h1><p>A tiny app for learning GitHub CI/CD</p><div class="counts"><h3 id="count">0 tasks</h3><h3 id="completed-count">0 completed</h3></div><input id="title" type="text" placeholder="Type a task" aria-label="Task title"><button onclick="add()">Add task</button><ul id="items"></ul></div><script>async function load(){const r=await fetch('/api/tasks');const a=await r.json();document.getElementById('count').textContent=a.length+' tasks';document.getElementById('completed-count').textContent=a.filter(x=>x.completed).length+' completed';document.getElementById('items').replaceChildren(...a.map(x=>{let li=document.createElement('li');li.classList.toggle('completed',x.completed);let box=document.createElement('input');box.type='checkbox';box.checked=Boolean(x.completed);box.setAttribute('aria-label','Mark '+x.title+' complete');box.onchange=()=>setCompleted(x.id,box.checked);let label=document.createElement('span');label.textContent=x.title;li.append(box,label);return li}))}async function setCompleted(id,completed){const r=await fetch('/api/tasks/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({completed})});if(!r.ok){alert('Unable to update task')}load()}async function add(){const i=document.getElementById('title');const r=await fetch('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:i.value})});if(!r.ok){alert('Please enter a task');return}i.value='';load()}load()</script></html>
