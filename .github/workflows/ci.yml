name: CI - build and test
on:
  pull_request:
    branches: [develop, main, 'release/**']
  push:
    branches: [develop, main, 'release/**']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m compileall -q app
      - name: Package app
        run: python -m zipfile -c taskflow-app.zip app/server.py app/index.html app/__init__.py
      - uses: actions/upload-artifact@v4
        with:
          name: taskflow-build-${{ github.sha }}
          path: taskflow-app.zip
