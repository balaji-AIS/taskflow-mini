<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TaskFlow Mini</title><style>body{font:16px system-ui;background:#f3f6fb;margin:0;padding:50px 15px;color:#19253c}.panel{max-width:560px;margin:auto;background:white;padding:30px;border-radius:18px;box-shadow:0 8px 35px #d9e0ed}h1{margin:0}p{color:#617087}input{padding:13px;border:1px solid #bbc6d6;border-radius:8px;width:65%}button{padding:13px;border:0;background:#265de4;color:white;border-radius:8px;cursor:pointer}li{padding:12px;border-bottom:1px solid #e9edf5}</style><div class="panel"><h1>✅ TaskFlow Mini</h1><p>A tiny app for learning GitHub CI/CD</p><h3 id="count">0 tasks</h3><input id="title" placeholder="Type a task" aria-label="Task title"><button onclick="add()">Add task</button><ul id="items"></ul></div><script>async function load(){const r=await fetch('/api/tasks');const a=await r.json();document.getElementById('count').textContent=a.length+' tasks';document.getElementById('items').replaceChildren(...a.map(x=>{let li=document.createElement('li');li.textContent=x.title;return li}))}async function add(){const i=document.getElementById('title');const r=await fetch('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:i.value})});if(!r.ok){alert('Please enter a task');return}i.value='';load()}load()</script></html>
